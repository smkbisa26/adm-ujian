<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kartu Ujian & Daftar Hadir 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel untuk kompilasi JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card-break { page-break-inside: avoid; break-inside: avoid; margin-bottom: 20px; }
    }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Komponen Icon SVG Mandiri (Bebas Error Dependency)
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        dashboard: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" /></svg>,
        users: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>,
        book: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>,
        check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>,
        settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>,
        logout: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>,
        printer: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>,
        search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>,
        plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>,
        edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>,
        trash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>,
        refresh: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></svg>,
        x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>,
        alert: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
      };
      return icons[name] || null;
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('login');
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(false);
      const [statusMessage, setStatusMessage] = useState(null);
      
      const [data, setData] = useState({
        Pengaturan: [{
          Logo_URL: 'https://upload.wikimedia.org/wikipedia/commons/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg',
          Nama_Sekolah: 'UPTD SMP NEGERI 2 GOLEWA',
          Tahun_Pelajaran: '2025/2026',
          Kop_Surat: 'PEMERINTAH KABUPATEN NGADA\nDINAS PENDIDIKAN, KEPEMUDAAN DAN OLAHRAGA'
        }],
        Akun: [{ Username: 'admin', Password: '123', Role: 'admin' }],
        Siswa: [
          { NISN: 'TP2410001100018', Nama: 'Renaldo Wendi Mite', Kelas: 'SMP/MTS Kelas 9', Foto_URL: '', Password_Ujian: '987321*', Tempat_Lahir: 'BAJAWA', Tanggal_Lahir: '09 November 2010', Ruang_Ujian: 'P24100011-AV7Z', Sesi: '1' },
          { NISN: 'TP2410001100027', Nama: 'Basilius Ponsianus Redo', Kelas: 'SMP/MTS Kelas 9', Foto_URL: '', Password_Ujian: '2410027*', Tempat_Lahir: 'BAJAWA', Tanggal_Lahir: '11 Mei 2010', Ruang_Ujian: 'P24100011-AV7Z', Sesi: '1' },
          { NISN: 'TP2410001100036', Nama: 'MARIA JUNYALOLA BANI', Kelas: 'SMP/MTS Kelas 9', Foto_URL: '', Password_Ujian: '432100*', Tempat_Lahir: 'BAJAWA', Tanggal_Lahir: '15 Juni 2010', Ruang_Ujian: 'P24100011-AV7Z', Sesi: '1' }
        ],
        Mapel: [
          { Kode_Mapel: 'M01', Nama_Mapel: 'SUSULAN TES KEMAMPUAN AKADEMIK', Link_Ujian: 'https://ujian.kemdikbud.go.id/susulan', Tanggal_Ujian: '11 Mei 2026', Waktu_Ujian: '08:00-09:45' }
        ],
        DaftarHadir: []
      });

      const [scriptUrl, setScriptUrl] = useState('');
      const [filterMapel, setFilterMapel] = useState('M01');
      const [filterRuang, setFilterRuang] = useState('');
      
      useEffect(() => {
        const savedUrl = localStorage.getItem('gas_script_url');
        if (savedUrl) {
          setScriptUrl(savedUrl);
          fetchData(savedUrl);
        }
      }, []);

      const fetchData = async (url) => {
        const targetUrl = url || scriptUrl;
        if (!targetUrl) return;
        setLoading(true);
        try {
          const response = await fetch(`${targetUrl}?action=getData`);
          const resJson = await response.json();
          if (resJson.status === 'success') {
            setData(resJson.data);
            showToast('Sinkronisasi data Google Sheets berhasil!', 'success');
          } else {
            showToast('Gagal memuat data: ' + resJson.message, 'error');
          }
        } catch (e) {
          showToast('Koneksi database offline / menggunakan database lokal.', 'error');
        } finally {
          setLoading(false);
        }
      };

      const showToast = (message, type) => {
        setStatusMessage({ message, type });
        setTimeout(() => setStatusMessage(null), 4000);
      };

      const handleLogin = (username, password) => {
        const foundAdmin = data.Akun.find(a => a.Username === username && a.Password === password);
        if (foundAdmin) {
          setUser({ username: foundAdmin.Username, role: 'admin' });
          setCurrentPage('dashboard');
          return true;
        }
        const foundSiswa = data.Siswa.find(s => s.NISN === username && s.Password_Ujian === password);
        if (foundSiswa) {
          setUser({ ...foundSiswa, role: 'peserta' });
          setCurrentPage('peserta-dashboard');
          return true;
        }
        return false;
      };

      const executePostAction = async (action, payload) => {
        if (!scriptUrl) {
          showToast('Tersimpan di lokal. Sambungkan URL Web App GAS untuk menyimpan ke cloud.', 'error');
          return true; 
        }
        setLoading(true);
        try {
          const response = await fetch(scriptUrl, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({ action, data: payload })
          });
          const resJson = await response.json();
          if (resJson.status === 'success') {
            showToast(resJson.message, 'success');
            fetchData(scriptUrl);
            return true;
          } else {
            showToast('Gagal: ' + resJson.message, 'error');
            return false;
          }
        } catch (e) {
          showToast('Gangguan jaringan database.', 'error');
          return false;
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 flex flex-col">
          {statusMessage && (
            <div className={`fixed top-5 right-5 z-50 p-4 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-0 ${
              statusMessage.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
            }`}>
              <Icon name="alert" size={20} />
              <span className="text-sm font-medium">{statusMessage.message}</span>
            </div>
          )}

          <header className="no-print bg-slate-900 text-white px-6 py-4 flex justify-between items-center border-b border-slate-800">
            <div className="flex items-center gap-3">
              <img src={data.Pengaturan[0]?.Logo_URL} alt="Logo" className="h-10 w-10 object-contain rounded-full bg-white p-1" />
              <div>
                <h1 className="font-bold tracking-wide text-md">{data.Pengaturan[0]?.Nama_Sekolah}</h1>
                <p className="text-[11px] text-slate-400">Asesmen Semester Genap TP {data.Pengaturan[0]?.Tahun_Pelajaran}</p>
              </div>
            </div>

            {user && (
              <div className="flex items-center gap-4">
                {loading && <Icon name="refresh" size={18} className="animate-spin text-blue-400" />}
                <span className="bg-slate-800 border border-slate-700 px-3 py-1 text-xs rounded-full font-medium text-slate-300">
                  {user.role === 'admin' ? '🛡️ Administrator' : `🎓 ${user.Nama}`}
                </span>
                <button onClick={() => { setUser(null); setCurrentPage('login'); }} className="flex items-center gap-1.5 text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg font-semibold transition">
                  <Icon name="logout" size={14} /> Keluar
                </button>
              </div>
            )}
          </header>

          <div className="flex flex-1">
            {user && (
              <aside className="no-print w-64 bg-slate-950 text-slate-300 flex flex-col justify-between border-r border-slate-900">
                <div className="p-4 space-y-1">
                  {user.role === 'admin' ? (
                    <>
                      <button onClick={() => setCurrentPage('dashboard')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="dashboard" /> Dashboard
                      </button>
                      <button onClick={() => setCurrentPage('crud-siswa')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'crud-siswa' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="users" /> Data Siswa
                      </button>
                      <button onClick={() => setCurrentPage('crud-mapel')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'crud-mapel' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="book" /> Mata Pelajaran
                      </button>
                      <button onClick={() => setCurrentPage('cetak-kartu')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'cetak-kartu' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="printer" /> Cetak Kartu Login
                      </button>
                      <button onClick={() => setCurrentPage('cetak-absen')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'cetak-absen' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="check" /> Cetak Daftar Hadir
                      </button>
                      <button onClick={() => setCurrentPage('pengaturan')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'pengaturan' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900 text-slate-400'}`}>
                        <Icon name="settings" /> Pengaturan
                      </button>
                    </>
                  ) : (
                    <>
                      <button onClick={() => setCurrentPage('peserta-dashboard')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'peserta-dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900'}`}>
                        <Icon name="dashboard" /> Dashboard Peserta
                      </button>
                      <button onClick={() => setCurrentPage('peserta-kartu')} className={`flex items-center gap-3 w-full p-3 rounded-xl text-left text-sm font-medium transition ${currentPage === 'peserta-kartu' ? 'bg-blue-600 text-white' : 'hover:bg-slate-900'}`}>
                        <Icon name="printer" /> Cetak Kartu Saya
                      </button>
                    </>
                  )}
                </div>
              </aside>
            )}

            <main className="flex-1 p-6 overflow-y-auto">
              {currentPage === 'login' && <LoginScreen onLogin={handleLogin} logo={data.Pengaturan[0]?.Logo_URL} namaSekolah={data.Pengaturan[0]?.Nama_Sekolah} />}
              {currentPage === 'dashboard' && <AdminDashboard data={data} onSync={() => fetchData()} loading={loading} />}
              {currentPage === 'peserta-dashboard' && <PesertaDashboard user={user} mapel={data.Mapel} logo={data.Pengaturan[0]?.Logo_URL} onSaveAbsen={(absen) => executePostAction('saveDaftarHadir', absen)} />}
              
              {currentPage === 'crud-siswa' && (
                <SiswaCRUD 
                  siswaList={data.Siswa} 
                  onSave={async (item) => {
                    const updated = data.Siswa.find(s => s.NISN === item.NISN) 
                      ? data.Siswa.map(s => s.NISN === item.NISN ? item : s)
                      : [...data.Siswa, item];
                    setData({ ...data, Siswa: updated });
                    await executePostAction('saveSiswa', item);
                  }} 
                  onDelete={async (nisn) => {
                    setData({ ...data, Siswa: data.Siswa.filter(s => s.NISN !== nisn) });
                    await executePostAction('deleteSiswa', { NISN: nisn });
                  }} 
                />
              )}

              {currentPage === 'crud-mapel' && (
                <MapelCRUD 
                  mapelList={data.Mapel} 
                  onSave={async (item) => {
                    const updated = data.Mapel.find(m => m.Kode_Mapel === item.Kode_Mapel)
                      ? data.Mapel.map(m => m.Kode_Mapel === item.Kode_Mapel ? item : m)
                      : [...data.Mapel, item];
                    setData({ ...data, Mapel: updated });
                    await executePostAction('saveMapel', item);
                  }} 
                  onDelete={async (kodeMapel) => {
                    setData({ ...data, Mapel: data.Mapel.filter(m => m.Kode_Mapel !== kodeMapel) });
                    await executePostAction('deleteMapel', { Kode_Mapel: kodeMapel });
                  }} 
                />
              )}

              {currentPage === 'cetak-kartu' && <CetakKartuScreen data={data} />}
              {currentPage === 'cetak-absen' && (
                <CetakAbsenScreen 
                  data={data} 
                  selectedMapel={filterMapel} 
                  setSelectedMapel={setFilterMapel} 
                  selectedRuang={filterRuang}
                  setSelectedRuang={setFilterRuang}
                />
              )}
              {currentPage === 'peserta-kartu' && <PesertaKartuSatu user={user} data={data} />}
              {currentPage === 'pengaturan' && (
                <PengaturanScreen 
                  settings={data.Pengaturan[0]} 
                  onSave={async (set) => {
                    setData({ ...data, Pengaturan: [set] });
                    await executePostAction('savePengaturan', set);
                  }} 
                  scriptUrl={scriptUrl} 
                  setScriptUrl={(url) => { setScriptUrl(url); localStorage.setItem('gas_script_url', url); fetchData(url); }} 
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    // ================= IMPLEMENTASI COMPONENT =================
    const LoginScreen = ({ onLogin, logo, namaSekolah }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!onLogin(username, password)) {
          setError('Kredensial salah! Silakan coba lagi.');
        }
      };

      return (
        <div className="max-w-md mx-auto mt-16 bg-white rounded-2xl shadow-2xl overflow-hidden border">
          <div className="bg-gradient-to-br from-indigo-700 to-slate-900 p-8 text-center text-white">
            <img src={logo} alt="Logo" className="h-16 mx-auto mb-3 bg-white p-2 rounded-full" />
            <h2 className="font-bold text-lg tracking-wide uppercase">{namaSekolah}</h2>
            <p className="text-xs text-indigo-200 mt-1 uppercase font-semibold">ASESMEN AKHIR SEMESTER GENAP</p>
          </div>
          <form onSubmit={submit} className="p-8 space-y-5">
            {error && <div className="text-xs bg-rose-50 text-rose-600 p-3 rounded-xl flex items-center gap-2">{error}</div>}
            <div>
              <label className="text-xs font-bold text-slate-500 block mb-1 uppercase tracking-wider">Username / NISN</label>
              <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 border rounded-xl outline-none text-sm bg-slate-50 font-medium" placeholder="Masukkan NISN atau admin" required />
            </div>
            <div>
              <label className="text-xs font-bold text-slate-500 block mb-1 uppercase tracking-wider">Password</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border rounded-xl outline-none text-sm bg-slate-50 font-medium" placeholder="Sandi Ujian" required />
            </div>
            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow-lg transition duration-200">MASUK SISTEM</button>
          </form>
        </div>
      );
    };

    const AdminDashboard = ({ data, onSync, loading }) => {
      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-black text-slate-800">Dashboard Utama</h2>
              <p className="text-sm text-slate-500 font-medium">Statistik pelaksanaan Asesmen Akhir Semester</p>
            </div>
            <button onClick={onSync} disabled={loading} className="flex items-center gap-2 bg-white border px-4 py-2 rounded-xl text-sm font-semibold transition">
              Sinkronkan Database
            </button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div className="bg-white p-5 rounded-2xl shadow-md border-l-4 border-blue-600">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Siswa Ujian</p>
              <p className="text-3xl font-black text-slate-800 mt-1">{data.Siswa.length}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl shadow-md border-l-4 border-emerald-600">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Mata Pelajaran</p>
              <p className="text-3xl font-black text-slate-800 mt-1">{data.Mapel.length}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl shadow-md border-l-4 border-amber-600">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Kehadiran</p>
              <p className="text-3xl font-black text-slate-800 mt-1">{data.DaftarHadir.length}</p>
            </div>

                        {isGanjil ? <span className="text-[10px] font-semibold">{noUrut}. .........................</span> : ""}
                      </td>
                      <td className="border-r border-black p-1 text-left w-[110px]">
                        {!isGanjil ? <span className="text-[10px] font-semibold">{noUrut}. .........................</span> : ""}
                      </td>
                      <td className="p-2"></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            <div className="grid grid-cols-[300px_1fr] gap-6 text-[11px] mt-8 items-start">
              <div className="border border-black p-3 space-y-1">
                <div className="flex justify-between"><span>Seharusnya Hadir</span><span>: ______ peserta</span></div>
                <div className="flex justify-between"><span>Tidak Hadir</span><span>: ______ peserta</span></div>
                <div className="flex justify-between font-bold border-t border-black pt-1"><span>Hadir</span><span>: ______ peserta</span></div>
              </div>
              <div className="grid grid-cols-2 text-center">
                <div className="flex flex-col justify-between h-24">
                  <p className="font-bold">Proktor</p>
                  <p className="font-bold underline">( _______________________ )</p>
                </div>
                <div className="flex flex-col justify-between h-24">
                  <p className="font-bold">Pengawas</p>
                  <p className="font-bold underline">( _______________________ )</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const PesertaKartuSatu = ({ user, data }) => {
      const settings = data.Pengaturan[0];
      return (
        <div className="space-y-4 max-w-xl mx-auto mt-6">
          <div className="no-print flex justify-end">
            <button onClick={() => window.print()} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold text-xs transition shadow-md">
              <Icon name="printer" size={14} /> Cetak Kartu Saya
            </button>
          </div>
          <div className="bg-white p-4 border border-black rounded-sm text-slate-900 w-full max-w-[500px] mx-auto font-sans">
            <div className="flex justify-between items-center border-b-2 border-black pb-2 mb-2">
              <img src={settings?.Logo_URL} alt="Logo" className="w-12 h-12 object-contain" />
              <div className="text-center flex-1 mx-2">
                <h3 className="font-extrabold text-[11px] leading-tight uppercase">KARTU LOGIN SUSULAN</h3>
                <h4 className="font-extrabold text-[11px] leading-tight uppercase">TES KEMAMPUAN AKADEMIK</h4>
                <p className="text-[10px] font-extrabold">TAHUN {settings?.Tahun_Pelajaran ? settings.Tahun_Pelajaran.split('/')[0] : '2026'}</p>
              </div>
              <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.Mapel[0]?.Link_Ujian || 'https://google.com')}`} alt="QR" className="w-12 h-12 border p-0.5 object-contain" />
            </div>
            <div className="grid grid-cols-[130px_10px_1fr] text-[11px] gap-y-1 mb-3">
              <span className="font-semibold text-slate-600">Nama Peserta</span><span>:</span><span className="font-bold">{user.Nama}</span>
              <span className="font-semibold text-slate-600">NISN</span><span>:</span><span className="font-bold">{user.NISN}</span>
              <span className="font-semibold text-slate-600">Sesi</span><span>:</span><span>Sesi {user.Sesi}</span>
            </div>
          </div>
        </div>
      );
    };

    const PengaturanScreen = ({ settings, onSave, scriptUrl, setScriptUrl }) => {
      const [form, setForm] = useState(settings || { Logo_URL: '', Nama_Sekolah: '', Tahun_Pelajaran: '', Kop_Surat: '' });

      return (
        <div className="bg-white rounded-2xl shadow-md p-6 max-w-2xl mx-auto space-y-6">
          <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} className="space-y-4">
            <div>
              <label className="text-xs font-bold block mb-1">NAMA SEKOLAH / INSTANSI</label>
              <input type="text" value={form.Nama_Sekolah} onChange={e => setForm({...form, Nama_Sekolah: e.target.value.toUpperCase()})} className="w-full p-2.5 border rounded-xl text-sm font-semibold" required />
            </div>
            <div>
              <label className="text-xs font-bold block mb-1">TAHUN PELAJARAN</label>
              <input type="text" value={form.Tahun_Pelajaran} onChange={e => setForm({...form, Tahun_Pelajaran: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm font-semibold" required />
            </div>
            <div>
              <label className="text-xs font-bold block mb-1">URL LINK LOGO SEKOLAH (PNG/WEB)</label>
              <input type="text" value={form.Logo_URL} onChange={e => setForm({...form, Logo_URL: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm font-semibold" required />
            </div>
            <div>
              <label className="text-xs font-bold block mb-1">KOP SURAT (BARIS ATAS)</label>
              <textarea rows="2" value={form.Kop_Surat} onChange={e => setForm({...form, Kop_Surat: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm font-semibold"></textarea>
            </div>
            <div className="border-t pt-4">
              <label className="text-xs font-bold text-amber-600 block mb-1">🔗 GOOGLE APPS SCRIPT WEBAPP URL</label>
              <input type="url" value={scriptUrl} onChange={e => setScriptUrl(e.target.value)} className="w-full p-2.5 border border-amber-300 rounded-xl text-sm font-semibold bg-amber-50" placeholder="https://script.google.com/macros/s/.../exec" />
            </div>
            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow-lg transition">Simpan Konfigurasi</button>
          </form>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
